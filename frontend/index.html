      (function() {
        try {
          var saved = localStorage.getItem('launchly_theme');
          var theme = (saved === 'dark' || saved === 'yellow' || saved === 'light') ? saved : 'light';
          var path = window.location.pathname;
          var isPublicBrand = path === '/' || path === '/login' || path === '/register' || path === '/blocked' || path === '/blog' || path.indexOf('/blog/') === 0 || path === '/terms' || path === '/privacy' || path === '/faq' || path === '/acceptable-use' || path === '/ai-terms' || path === '/payment-terms';
          if (!isPublicBrand) {
            document.documentElement.setAttribute('data-theme', theme);
          }
        } catch (e) {}
      })();
    </script>
