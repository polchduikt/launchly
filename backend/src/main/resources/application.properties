spring.application.name=launchly
spring.docker.compose.enabled=false
spring.profiles.include=secrets

server.port=8080

spring.datasource.url=jdbc:postgresql://localhost:5432/launchly
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

spring.liquibase.change-log=classpath:db/changelog/db-changelog-master.yaml

app.jwt.access-token-expiration=900000
app.jwt.refresh-token-expiration=604800000

app.oauth2.redirect-uri=http://localhost:5173/oauth2/callback

management.health.redis.enabled=false

spring.data.redis.host=localhost
spring.data.redis.port=6379

telegram.mode=polling
telegram.webhook-url=

groq.api-key=${GROQ_API_KEY:}
groq.base-url=https://api.groq.com/openai/v1
groq.model=llama-3.3-70b-versatile
groq.max-tokens=2048
groq.temperature=0.7

cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}
app.media.max-file-size=20971520
app.media.allowed-types=image/jpeg,image/png,image/webp,image/gif,audio/mpeg,audio/mp3,audio/wav,audio/ogg,audio/m4a,audio/x-m4a,audio/mp4,audio/amr,video/mp4,video/mpeg,video/quicktime,video/webm,video/x-matroska,video/x-msvideo,application/pdf,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document,application/vnd.ms-excel,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/zip,application/x-zip-compressed,application/x-rar-compressed,text/plain,application/octet-stream
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB