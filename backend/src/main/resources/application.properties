spring.application.name=launchly
spring.docker.compose.enabled=false
spring.profiles.include=secrets
server.port=8080

spring.datasource.url=jdbc:postgresql://localhost:5432/launchly
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.liquibase.change-log=classpath:db/changelog/db-changelog-master.yaml

app.jwt.access-token-expiration=900000
app.jwt.refresh-token-expiration=604800000
app.oauth2.redirect-uri=http://localhost:5173/oauth2/callback
app.security.super-admin-email=${SUPER_ADMIN_EMAIL:}
management.health.redis.enabled=false
spring.data.redis.host=localhost
spring.data.redis.port=6379

telegram.mode=polling
telegram.webhook-url=
telegram.system-bot-token=${TELEGRAM_SYSTEM_BOT_TOKEN:}
telegram.system-bot-username=${TELEGRAM_SYSTEM_BOT_USERNAME:}

cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}
app.media.max-file-size=20971520
app.media.allowed-types=image/jpeg,image/png,image/webp,image/gif,audio/mpeg,audio/mp3,audio/wav,audio/ogg,audio/m4a,audio/x-m4a,audio/mp4,audio/amr,video/mp4,video/mpeg,video/quicktime,video/webm,video/x-matroska,video/x-msvideo,application/pdf,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document,application/vnd.ms-excel,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/zip,application/x-zip-compressed,application/x-rar-compressed,text/plain,application/octet-stream
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

ai.providers=${AI_PROVIDERS:groq,gemini,openrouter,cerebras}
groq.api-key=${GROQ_API_KEY:}
groq.base-url=https://api.groq.com/openai/v1
groq.model=llama-3.3-70b-versatile
groq.max-tokens=8192
groq.temperature=0.7

gemini.api-key=${GEMINI_API_KEY:}
gemini.base-url=https://generativelanguage.googleapis.com/v1beta
gemini.model=${GEMINI_MODEL:gemini-2.5-flash}
gemini.max-tokens=8192
gemini.temperature=0.7

openrouter.api-key=${OPENROUTER_API_KEY:}
openrouter.base-url=https://openrouter.ai/api/v1
openrouter.model=${OPENROUTER_MODEL:qwen/qwen3-32b}
openrouter.max-tokens=8192
openrouter.temperature=0.7
openrouter.site-url=${APP_URL:http://localhost:5173}
openrouter.app-name=${OPENROUTER_APP_NAME:Launchly}

cerebras.api-key=${CEREBRAS_API_KEY:}
cerebras.base-url=https://api.cerebras.ai/v1
cerebras.model=${CEREBRAS_MODEL:gpt-oss-120b}
cerebras.max-tokens=8192
cerebras.temperature=0.7

spring.mail.host=${app.secrets.mail.host:smtp.gmail.com}
spring.mail.port=${app.secrets.mail.port:587}
spring.mail.username=${app.secrets.mail.username:}
spring.mail.password=${app.secrets.mail.password:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

app.frontend-url=${APP_URL:http://localhost:5173}

spring.messages.basename=messages_errors,messages_system
spring.messages.encoding=UTF-8



