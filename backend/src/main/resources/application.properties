spring.application.name=launchly
spring.docker.compose.enabled=false
spring.docker.compose.mode=off
spring.profiles.include=secrets
server.port=8080
spring.threads.virtual.enabled=true

server.tomcat.accept-count=1000
server.tomcat.max-connections=10000

spring.datasource.url=jdbc:postgresql://localhost:5432/launchly
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX_POOL_SIZE:20}
spring.datasource.hikari.minimum-idle=20
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.leak-detection-threshold=10000
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true
spring.jpa.properties.jakarta.persistence.query.timeout=5000
spring.jpa.open-in-view=false
spring.liquibase.change-log=classpath:db/changelog/db-changelog-master.yaml
spring.mvc.async.request-timeout=30000

server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

app.jwt.access-token-expiration=900000
app.jwt.refresh-token-expiration=604800000
app.oauth2.redirect-uri=http://localhost:5173/oauth2/callback
app.security.super-admin-email=${SUPER_ADMIN_EMAIL:}

cloudflare.turnstile.enabled=${CLOUDFLARE_TURNSTILE_ENABLED:true}
cloudflare.turnstile.verify-url=${CLOUDFLARE_TURNSTILE_VERIFY_URL:https://challenges.cloudflare.com/turnstile/v0/siteverify}

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=db
management.endpoint.health.group.liveness.include=ping
management.info.env.enabled=false
management.info.java.enabled=true
management.info.os.enabled=true
management.health.redis.enabled=false

spring.data.redis.host=localhost
spring.data.redis.port=6379

telegram.mode=polling
telegram.webhook-url=
telegram.system-bot-token=${TELEGRAM_SYSTEM_BOT_TOKEN:}
telegram.system-bot-username=${TELEGRAM_SYSTEM_BOT_USERNAME:}

cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}
app.media.max-file-size=20971520
app.media.allowed-types=image/jpeg,image/png,image/webp,image/gif,audio/mpeg,audio/mp3,audio/wav,audio/ogg,audio/m4a,audio/x-m4a,audio/mp4,audio/amr,video/mp4,video/mpeg,video/quicktime,video/webm,video/x-matroska,video/x-msvideo,application/pdf,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document,application/vnd.ms-excel,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/zip,application/x-zip-compressed,application/x-rar-compressed,text/plain,application/octet-stream
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

ai.providers=${AI_PROVIDERS:groq,gemini,openrouter,cerebras}
groq.api-key=${GROQ_API_KEY:}
groq.base-url=https://api.groq.com/openai/v1
groq.model=llama-3.3-70b-versatile
groq.max-tokens=8192
groq.temperature=0.7

gemini.api-key=${GEMINI_API_KEY:}
gemini.base-url=https://generativelanguage.googleapis.com/v1beta
gemini.model=${GEMINI_MODEL:gemini-2.5-flash}
gemini.max-tokens=8192
gemini.temperature=0.7

openrouter.api-key=${OPENROUTER_API_KEY:}
openrouter.base-url=https://openrouter.ai/api/v1
openrouter.model=${OPENROUTER_MODEL:qwen/qwen3-32b}
openrouter.max-tokens=8192
openrouter.temperature=0.7
openrouter.site-url=${APP_URL:http://localhost:5173}
openrouter.app-name=${OPENROUTER_APP_NAME:Launchly}

cerebras.api-key=${CEREBRAS_API_KEY:}
cerebras.base-url=https://api.cerebras.ai/v1
cerebras.model=${CEREBRAS_MODEL:gpt-oss-120b}
cerebras.max-tokens=8192
cerebras.temperature=0.7

spring.mail.host=${app.secrets.mail.host:smtp.gmail.com}
spring.mail.port=${app.secrets.mail.port:587}
spring.mail.username=${app.secrets.mail.username:}
spring.mail.password=${app.secrets.mail.password:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

app.frontend-url=${APP_URL:http://localhost:5173}

spring.messages.basename=messages_errors,messages_system
spring.messages.encoding=UTF-8

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.display-request-duration=true

resilience4j.circuitbreaker.instances.googleSheets.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.googleSheets.sliding-window-size=10
resilience4j.circuitbreaker.instances.googleSheets.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.googleSheets.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.googleSheets.slow-call-rate-threshold=75
resilience4j.circuitbreaker.instances.googleSheets.slow-call-duration-threshold=4s
resilience4j.circuitbreaker.instances.googleSheets.wait-duration-in-open-state=20s
resilience4j.circuitbreaker.instances.googleSheets.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.googleSheets.automatic-transition-from-open-to-half-open-enabled=true
resilience4j.circuitbreaker.instances.googleSheets.ignore-exceptions=com.launchly.common.exception.AppException

resilience4j.circuitbreaker.instances.aiProvider.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.aiProvider.sliding-window-size=10
resilience4j.circuitbreaker.instances.aiProvider.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.aiProvider.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.aiProvider.slow-call-rate-threshold=80
resilience4j.circuitbreaker.instances.aiProvider.slow-call-duration-threshold=15s
resilience4j.circuitbreaker.instances.aiProvider.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.aiProvider.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.aiProvider.automatic-transition-from-open-to-half-open-enabled=true
resilience4j.circuitbreaker.instances.aiProvider.ignore-exceptions=com.launchly.common.exception.AppException

resilience4j.circuitbreaker.instances.stripe.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.stripe.sliding-window-size=10
resilience4j.circuitbreaker.instances.stripe.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.stripe.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.stripe.wait-duration-in-open-state=20s
resilience4j.circuitbreaker.instances.stripe.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.stripe.automatic-transition-from-open-to-half-open-enabled=true
resilience4j.circuitbreaker.instances.stripe.ignore-exceptions=com.launchly.common.exception.AppException

resilience4j.circuitbreaker.instances.telegram.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.telegram.sliding-window-size=20
resilience4j.circuitbreaker.instances.telegram.minimum-number-of-calls=10
resilience4j.circuitbreaker.instances.telegram.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.telegram.wait-duration-in-open-state=15s
resilience4j.circuitbreaker.instances.telegram.permitted-number-of-calls-in-half-open-state=5
resilience4j.circuitbreaker.instances.telegram.automatic-transition-from-open-to-half-open-enabled=true
resilience4j.circuitbreaker.instances.telegram.ignore-exceptions=com.launchly.common.exception.AppException

resilience4j.retry.instances.googleSheets.max-attempts=2
resilience4j.retry.instances.googleSheets.wait-duration=1s
resilience4j.retry.instances.googleSheets.ignore-exceptions=com.launchly.common.exception.AppException

resilience4j.retry.instances.aiProvider.max-attempts=2
resilience4j.retry.instances.aiProvider.wait-duration=1s
resilience4j.retry.instances.aiProvider.ignore-exceptions=com.launchly.common.exception.AppException

resilience4j.retry.instances.stripe.max-attempts=2
resilience4j.retry.instances.stripe.wait-duration=500ms
resilience4j.retry.instances.stripe.ignore-exceptions=com.launchly.common.exception.AppException

resilience4j.retry.instances.telegram.max-attempts=2
resilience4j.retry.instances.telegram.wait-duration=500ms
resilience4j.retry.instances.telegram.ignore-exceptions=com.launchly.common.exception.AppException
