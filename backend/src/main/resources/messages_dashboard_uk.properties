dashboard.template.lead_magnet.title=Збирайте контактну інформацію клієнтів за допомогою автоматизованого лід-магніту
dashboard.template.lead_magnet.desc=Автоматично створюйте базу контактів клієнтів, пропонуючи корисні ресурси безпосередньо в Telegram. Надсилайте файли, електронні книги або посібники миттєво після отримання контактних даних користувача.
dashboard.template.lead_magnet.business_value=Збільшуйте базу даних клієнтів та миттєво будуйте довіру. Конвертує високоцільові запити в чаті в контакти електронної пошти без необхідності створювати зовнішні цільові сторінки, форми реєстрації або складні воронки.
dashboard.template.lead_magnet.how_it_works=Запускається автоматично, коли користувач натискає на ваше посилання або надсилає певне ключове слово. Вітає його, запитує адресу електронної пошти та миттєво надає посилання на завантаження після відповіді.

dashboard.template.qualify_leads.title=Кваліфікуйте лідів та сегментуйте аудиторію за допомогою лід-опитування
dashboard.template.qualify_leads.desc=Задавайте інтерактивні питання з варіантами відповідей, щоб кваліфікувати лідів та автоматично направляти їх на різні шляхи продажів на основі їхніх уподобань.
dashboard.template.qualify_leads.business_value=Заощаджує час вашої команди продажів шляхом попередньої кваліфікації потенційних клієнтів. Автоматично розподіляє користувачів на сегменти та миттєво надає персоналізовані рекомендації щодо продуктів.
dashboard.template.qualify_leads.how_it_works=Задає запитання з вбудованими кнопками. Коли користувач обирає відповідь, потік розгалужується і направляє його до різних блоків повідомлень із користувацькими контрольними списками чи ресурсами.

dashboard.template.redirect_website.title=Спрямовуйте клієнтів до магазину чи підтримки за допомогою кнопок меню Telegram
dashboard.template.redirect_website.desc=Створіть інтерактивне меню швидкого доступу внизу чату, щоб спрямовувати користувачів безпосередньо до каталогу товарів, інтернет-магазину або порталу підтримки.
dashboard.template.redirect_website.business_value=Збільшує трафік сайту та спрощує навігацію для клієнтів. Дозволяє користувачам знаходити категорії вашого магазину та посилання на підтримку в один клік.
dashboard.template.redirect_website.how_it_works=Вітає користувачів повідомленням, що супроводжується нижніми кнопками швидкого меню. На основі обраного пункту меню надсилає цільове посилання для перегляду товарів або звернення до підтримки.

dashboard.template.event_reminders.title=Надсилайте автоматичні нагадування про події та вебінари
dashboard.template.event_reminders.desc=Підтримуйте залученість зареєстрованих учасників, плануючи автоматичні повідомлення з підтвердженням, щоденні нагадування та посилання для приєднання до події.
dashboard.template.event_reminders.business_value=Кардинально підвищує рівень відвідуваності подій та вебінарів. Тримає ваш бренд у пам'яті користувача та повністю автоматизує процес подальшого спілкування.
dashboard.template.event_reminders.how_it_works=Підтверджує реєстрацію, очікує вказаний час за допомогою блоку інтелектуальної затримки та надсилає повідомлення-нагадування, яке містить пряме посилання для приєднання до події.

dashboard.template.ab_test_promo.title=Запускайте A/B тестування рекламних пропозицій за допомогою рандомізатора
dashboard.template.ab_test_promo.desc=Автоматично розподіляйте трафік між двома рекламними повідомленнями, щоб виміряти, яка пропозиція працює краще.
dashboard.template.ab_test_promo.business_value=Оптимізує вашу воронку продажів шляхом визначення пропозиції з найвищою конверсією. Дозволяє приймати маркетингові рішення на основі даних безпосередньо в Telegram.
dashboard.template.ab_test_promo.how_it_works=Рандомізатор розподіляє вхідних користувачів 50 на 50. Половина отримує пропозицію А (посилання на знижку), а інша половина — пропозицію Б (посилання на безкоштовну доставку).

dashboard.template.vip_routing.title=Спрямовуйте клієнтів динамічно на основі VIP-статусу
dashboard.template.vip_routing.desc=Використовуйте блок умов (Condition), щоб перевірити, чи має користувач тег VIP, та спрямувати його до пріоритетної підтримки або звичайного оператора.
dashboard.template.vip_routing.business_value=Гарантує, що найцінніші клієнти отримають швидшу підтримку. Допомагає правильно розподіляти ресурси та підвищує рівень задоволеності ключових користувачів.
dashboard.template.vip_routing.how_it_works=Перевіряє, чи має користувач тег 'VIP'. Якщо так, спрямовує його за шляхом VIP-повідомлень; якщо ні — направляє на інформацію про стандартну підтримку.


