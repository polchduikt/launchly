dashboard.template.lead_magnet.title=Capture customer contact information with an automated Lead Magnet
dashboard.template.lead_magnet.desc=Build your customer email list automatically by offering valuable resources directly inside Telegram. Send files, ebooks, or guides instantly after getting user contact information.
dashboard.template.lead_magnet.business_value=Grow your customer database and build trust instantly. Converts high-intent chat inquiries into email contacts without requiring external landing pages, sign-up forms, or complex funnels.
dashboard.template.lead_magnet.how_it_works=Starts automatically when a user clicks your link or sends a specific keyword. It greets them, requests their email address, and instantly delivers the download link once they reply.

dashboard.template.qualify_leads.title=Qualify prospects and segment your audience with a Lead Quiz
dashboard.template.qualify_leads.desc=Ask interactive multiple-choice questions to filter high-value leads and automatically direct them to different sales paths based on their preferences.
dashboard.template.qualify_leads.business_value=Saves time for your sales team by pre-qualifying prospects. Groups users into segments automatically and delivers personalized product recommendations instantly.
dashboard.template.qualify_leads.how_it_works=Asks a question with inline buttons. When a user selects an answer, the flow branches and routes them to different message blocks with custom checklists or resources.

dashboard.template.redirect_website.title=Direct customers to your store or support using Telegram Menu Buttons
dashboard.template.redirect_website.desc=Provide a quick-access interactive menu at the bottom of the chat to guide users directly to your products catalog, online store, or support portal.
dashboard.template.redirect_website.business_value=Improves site traffic and simplifies customer navigation. Allows users to discover your store categories and support links in a single click.
dashboard.template.redirect_website.how_it_works=Greets users with a message accompanied by bottom menu reply buttons. Based on the selected menu option, it sends a targeted link to browse products or reach support.

dashboard.template.event_reminders.title=Send automated event reminders and webinar follow-ups
dashboard.template.event_reminders.desc=Keep your registered attendees engaged by scheduling automated confirmation messages, daily reminders, and event joining links.
dashboard.template.event_reminders.business_value=Drastically improves event show-up rates and webinars attendance. Keeps your brand fresh in the user's mind and automates the entire follow-up workflow.
dashboard.template.event_reminders.how_it_works=Confirms registration, waits for a specified delay using a smart delay block, and sends a reminder message containing the direct link to join the event.

dashboard.template.ab_test_promo.title=Run A/B testing for promotional offers using a Randomizer
dashboard.template.ab_test_promo.desc=Split your traffic automatically between two promotional messages to measure which offer performs better.
dashboard.template.ab_test_promo.business_value=Optimizes your sales funnel by identifying the highest-converting offer. Allows data-backed marketing decisions directly inside Telegram.
dashboard.template.ab_test_promo.how_it_works=A randomizer splits incoming users fifty-fifty. Half get Offer A (discount link), and the other half get Offer B (free shipping link).

dashboard.template.vip_routing.title=Route customers dynamically based on VIP membership status
dashboard.template.vip_routing.desc=Use a Condition block to verify if a user has a VIP tag, routing them to priority support or a standard agent.
dashboard.template.vip_routing.business_value=Ensures high-value customers get faster support. Helps prioritize resource allocation and improves customer satisfaction for key users.
dashboard.template.vip_routing.how_it_works=Checks if the user has the 'VIP' tag. If yes, it routes them to a VIP message path; if no, it routes them to standard support details.


