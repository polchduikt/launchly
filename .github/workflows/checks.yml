name: Checks & Validation

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-checks:
    name: Backend — Test & Quality Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Cache SonarCloud packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Run Maven Tests & Generate JaCoCo Coverage
        working-directory: backend
        run: mvn clean verify -B

      - name: Dump Surefire Reports on Failure
        if: failure()
        working-directory: backend
        run: |
          python3 << 'EOF'
          import glob
          import xml.etree.ElementTree as ET

          found_root_cause = False
          for xml_file in sorted(glob.glob("target/surefire-reports/TEST-*.xml")):
              try:
                  tree = ET.parse(xml_file)
                  root = tree.getroot()
                  for tc in root.findall("testcase"):
                      for err in tc.findall("error"):
                          text = err.text or err.attrib.get("message", "")
                          if "failure threshold" not in text:
                              found_root_cause = True
                              print("=" * 80)
                              print(">>> ROOT CAUSE ERROR: " + xml_file + " -> " + tc.attrib.get("name", "") + " <<<")
                              print("=" * 80)
                              print(text)
                              print("")
                      for fail in tc.findall("failure"):
                          text = fail.text or fail.attrib.get("message", "")
                          if "failure threshold" not in text:
                              found_root_cause = True
                              print("=" * 80)
                              print(">>> ROOT CAUSE FAILURE: " + xml_file + " -> " + tc.attrib.get("name", "") + " <<<")
                              print("=" * 80)
                              print(text)
                              print("")
              except Exception as e:
                  print("Error parsing " + xml_file + ": " + str(e))

          if not found_root_cause:
              print("No non-threshold error found in XMLs, checking .txt and .dump files...")
              for txt_file in sorted(glob.glob("target/surefire-reports/*.txt")):
                  try:
                      with open(txt_file, "r", encoding="utf-8", errors="ignore") as f:
                          content = f.read()
                          if "ERROR" in content or "FAILURE" in content:
                              print("=" * 80)
                              print(">>> TXT REPORT: " + txt_file + " <<<")
                              print("=" * 80)
                              print(content[:3000])
                  except Exception as e:
                      pass
          EOF

      - name: SonarCloud Scan
        if: ${{ env.SONAR_TOKEN != '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        working-directory: backend
        run: |
          mvn org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.projectKey=polchduikt_launchly \
            -Dsonar.organization=polchduikt \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml

  frontend-checks:
    name: Frontend — Lint, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint code
        working-directory: frontend
        run: npm run lint

      - name: Run Vitest Unit Tests & Coverage
        working-directory: frontend
        run: npm run test:coverage

      - name: Typecheck & Build SPA
        working-directory: frontend
        run: npm run build

  code-duplication:
    name: Code Duplication
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run jscpd duplication check
        run: npx jscpd --config .jscpd.json

  secret-scanning:
    name: Secret Scanning
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker-checks:
    name: Docker — Container Build Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: launchly-backend:test

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: launchly-frontend:test
